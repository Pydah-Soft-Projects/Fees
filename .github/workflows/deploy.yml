name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to AWS Lightsail
    runs-on: ubuntu-latest

    steps:
      #################################################
      # Checkout code
      #################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################
      # Setup Node.js for frontend build
      #################################################
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      #################################################
      # Build frontend on GitHub Actions
      #################################################
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_CRM_FRONTEND_URL: https://crm.pydah.edu.in
          VITE_CRM_BACKEND_URL: https://crm.pydah.edu.in
        run: |
          npm run build

      #################################################
      # Configure SSH
      #################################################
      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HOST }}" >> ~/.ssh/known_hosts

      #################################################
      # Upload frontend dist to server
      #################################################
      - name: Upload frontend build
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:/tmp/frontend-dist/"

      #################################################
      # Deploy to server
      #################################################
      - name: Deploy to server
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${USERNAME}@${HOST}" << 'ENDSSH'

          set -e

          PROJECT_DIR="/home/ec2-user/PydahFeeManagement"
          FRONTEND_WEB_ROOT="/var/www/pydahfee"

          echo "=========================================="
          echo "Starting deployment"
          echo "=========================================="

          cd "${PROJECT_DIR}"

          echo "==> Pulling latest code from main..."
          git fetch origin main
          git checkout main
          # Discard any local changes to log files before pulling
          git checkout -- backend/logs/ 2>/dev/null || true
          git pull origin main

          #################################################
          # BACKEND PART (UNCHANGED)
          #################################################
          echo "==> Checking backend dependencies..."
          cd "${PROJECT_DIR}/backend"

          LOCK_HASH_FILE="${PROJECT_DIR}/backend/.npm-ci-lockhash"
          CURRENT_HASH="$(sha256sum package-lock.json package.json 2>/dev/null | sha256sum | awk '{print $1}')"
          PREV_HASH="$(cat "${LOCK_HASH_FILE}" 2>/dev/null || true)"

          if [ ! -d node_modules ] || [ "${CURRENT_HASH}" != "${PREV_HASH}" ]; then
            echo "==> Installing backend dependencies (lockfile changed or node_modules missing)..."
            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi
            echo "${CURRENT_HASH}" > "${LOCK_HASH_FILE}"
          else
            echo "==> Backend dependencies unchanged, skipping npm ci"
          fi

          #################################################
          # FRONTEND PART (UPDATED)
          #################################################
          echo "==> Deploying frontend..."
          sudo mkdir -p "${FRONTEND_WEB_ROOT}"

          sudo rsync -av --delete \
            /tmp/frontend-dist/ \
            "${FRONTEND_WEB_ROOT}/"

          #################################################
          # PM2
          #################################################
          echo "==> Restarting PM2 process: backend..."
          pm2 restart backend

          echo "==> Saving PM2 process list..."
          pm2 save

          #################################################
          # Cleanup
          #################################################
          rm -rf /tmp/frontend-dist

          echo "=========================================="
          echo "Deployment completed successfully"
          echo "=========================================="

          ENDSSH

      #################################################
      # Cleanup SSH key
      #################################################
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key