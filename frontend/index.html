    <!-- Centralized Theme Runtime Loader SDK (Auto-switches between Local Editor and Production) -->
    <script>
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var serverUrl = isLocal ? 'http://localhost:7000' : 'https://ui-theme.pydah.edu.in';
        var pollInterval = isLocal ? '5' : '30';

        var script = document.createElement('script');
        script.id = 'pydah-central-theme-loader';
        script.src = serverUrl + '/themes/theme-loader.js';
        script.setAttribute('data-theme-server', serverUrl);
        script.setAttribute('data-poll-interval', pollInterval);

        if (isLocal) {
          script.onerror = function() {
            console.warn('[ThemeLoader] Local theme server (port 7000) not reached, falling back to production theme server.');
            var fallback = document.createElement('script');
            fallback.src = 'https://ui-theme.pydah.edu.in/themes/theme-loader.js';
            fallback.setAttribute('data-theme-server', 'https://ui-theme.pydah.edu.in');
            fallback.setAttribute('data-poll-interval', '30');
            document.head.appendChild(fallback);
          };
        }

        document.head.appendChild(script);
      })();
    </script>

    <!-- Legacy browser polyfills (Chrome <= 121, Windows 7 compatibility) -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          if (typeof window.Iterator === 'undefined') {
            window.Iterator = function Iterator() {};
            window.Iterator.prototype = {};
          }
          if (typeof Promise.withResolvers !== 'function') {
            Promise.withResolvers = function () {
              var resolve, reject;
              var promise = new Promise(function (res, rej) {
                resolve = res;
                reject = rej;
              });
              return { promise: promise, resolve: resolve, reject: reject };
            };
          }
          if (typeof Promise.try !== 'function') {
            Promise.try = function (fn) {
              var args = Array.prototype.slice.call(arguments, 1);
              return new Promise(function (resolve) {
                resolve(fn.apply(null, args));
              });
            };
          }
          if (typeof Object.groupBy !== 'function') {
            Object.groupBy = function (items, callback) {
              var result = {};
              if (items && typeof items.forEach === 'function') {
                items.forEach(function (item, idx) {
                  var key = callback(item, idx);
                  if (!result[key]) result[key] = [];
                  result[key].push(item);
                });
              }
              return result;
            };
          }
          if (typeof Number.prototype.toHex !== 'function') {
            Number.prototype.toHex = function (minDigits) {
              minDigits = minDigits || 1;
              var hex = Math.floor(Math.abs(this)).toString(16);
              while (hex.length < minDigits) {
                hex = '0' + hex;
              }
              return hex;
            };
          }
        }
      })();
    </script>
